name: Build

# PR'larda ve elle çalıştırıldığında derleyip test eder; v* etiketi atılınca
# (ör. git tag v0.2.0 && git push origin v0.2.0) GitHub Release oluşturur.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Mac uygulaması için macOS gerekir; Windows exe'leri de burada çapraz
    # derlenir (cgo yok).
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe ve yapı numarası için

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Sürüm
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="$(git describe --tags --always)"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Sürüm: $v"

      - name: Test
        run: make test

      - name: Derle
        run: make winassets dist VERSION="$VERSION"

      - name: PR derlemesini sakla
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: discord-bypass-${{ env.VERSION }}
          path: dist/
          retention-days: 14

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/* \
            --title "Discord Bypass $VERSION" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            --verify-tag
